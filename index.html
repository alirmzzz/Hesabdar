<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#081224" />
  <title>هم‌بودجه</title>
  <style>
    :root{
      --bg:#f4f7fb;--bg2:#eaf0f8;--card:#ffffff;--card2:#f8fbff;--text:#0f172a;--muted:#64748b;--line:#d7e1ef;
      --accent:#14b8a6;--accent2:#0f766e;--danger:#ef4444;--warn:#f59e0b;--ok:#16a34a;--shadow:0 14px 34px rgba(15,23,42,.08);
      --soft:0 8px 20px rgba(15,23,42,.05);--tabbar:92px;--fab:64px;
    }
    body.theme-dark{
      --bg:#07111f;--bg2:#0c1830;--card:#0d1830;--card2:#101d39;--text:#eef4ff;--muted:#9aaccc;--line:#1d2d52;
      --accent:#20c9ba;--accent2:#15988b;--danger:#f87171;--warn:#fbbf24;--ok:#4ade80;--shadow:0 16px 34px rgba(0,0,0,.28);
      --soft:0 10px 24px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2) 38%,var(--bg));color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:.22s ease}
    .app{max-width:880px;margin:0 auto;padding:16px 14px calc(var(--tabbar) + env(safe-area-inset-bottom) + 18px)}
    .screen{display:none}.screen.active{display:block}
    .hero{padding:6px 2px 8px;margin-bottom:12px}
    .hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .brand h1{margin:0;font-size:34px;line-height:1.02;font-weight:950;letter-spacing:-.03em}
    .brand p{margin:8px 0 0;color:var(--muted);font-size:14px}
    .version{display:inline-flex;align-items:center;padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--card) 88%, transparent)}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .mini-btn,.tab,.btn,.fab,.icon-btn,.ghost-link,.budget-head,.item,.accordion-toggle{transition:transform .08s ease, box-shadow .15s ease, background .18s ease, border-color .18s ease, opacity .18s ease}
    .mini-btn,.btn,.icon-btn,.tab,.fab,.ghost-link,.more-btn,.step-btn,.accordion-toggle{touch-action:manipulation;user-select:none}
    .mini-btn:active,.btn:active,.icon-btn:active,.tab:active,.fab:active,.ghost-link:active,.more-btn:active,.step-btn:active,.accordion-toggle:active{transform:scale(.97)}
    .mini-btn,.icon-btn,.btn,.more-btn,.step-btn{cursor:pointer}
    .mini-btn{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 90%, transparent);color:var(--text);font-weight:800;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--soft)}
    .mini-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
    .mini-btn:hover,.btn:hover,.icon-btn:hover,.more-btn:hover{box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 14%, transparent)}
    .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
    .section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
    .title-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .section-title{font-size:17px;font-weight:900}
    .section-sub{font-size:12px;color:var(--muted);margin-top:4px}
    .icon-btn{width:28px;height:28px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%, transparent);color:var(--muted);display:grid;place-items:center;font-weight:900;font-size:13px}
    .metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .metric{padding:14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--card) 80%, transparent),color-mix(in srgb,var(--bg) 24%, transparent))}
    .metric .label{font-size:12px;color:var(--muted);margin-bottom:6px}.metric .value{font-size:22px;font-weight:900}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between}.list{display:grid;gap:10px}
    .item{padding:12px 13px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%, transparent);box-shadow:var(--soft)}
    .item:hover{transform:translateY(-1px)}
    .muted{color:var(--muted)} .sm{font-size:12px}
    input,select,textarea,button{font:inherit}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--text);outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%, transparent)}
    .grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .btn{min-height:42px;padding:10px 14px;border-radius:14px;border:none;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 22%, transparent)}
    .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}
    .btn.ghost{background:color-mix(in srgb,var(--card) 86%, transparent);border:1px solid var(--line);color:var(--text)}
    .btn.danger{background:color-mix(in srgb,var(--danger) 12%, transparent);border:1px solid color-mix(in srgb,var(--danger) 26%, transparent);color:var(--danger)}
    .btn.sm{min-height:34px;padding:7px 11px;border-radius:12px;font-size:12px}
    .inline-actions{display:flex;gap:8px;flex-wrap:wrap}
    .badge{padding:6px 10px;border-radius:999px;font-size:11px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 86%, transparent)}
    .progress{height:10px;border-radius:999px;background:color-mix(in srgb,var(--bg) 74%, transparent);overflow:hidden;margin-top:8px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
    .notice,.empty{padding:14px;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 86%, transparent)}
    .empty{text-align:center;color:var(--muted)}
    table{width:100%;border-collapse:collapse} th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:13px} th{color:var(--muted);font-weight:800}
    .fab{position:fixed;left:max(16px,calc(env(safe-area-inset-left) + 12px));bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 22px);width:var(--fab);height:var(--fab);display:grid;place-items:center;border-radius:24px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:34px;box-shadow:0 18px 34px color-mix(in srgb,var(--accent) 28%, transparent),0 8px 16px rgba(0,0,0,.18);z-index:40}
    .tabs-wrap{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 24%, transparent),color-mix(in srgb,var(--bg) 94%, transparent) 35%,color-mix(in srgb,var(--bg) 99%, transparent));backdrop-filter:blur(18px)}
    .tabs{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px;background:color-mix(in srgb,var(--card) 78%, transparent);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
    .tab{min-height:52px;border-radius:18px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center;gap:4px}
    .tab.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 24px color-mix(in srgb,var(--accent) 22%, transparent)}
    .tab-icon{font-size:18px}.tab-label{font-size:11px;font-weight:800}
    .ring-wrap{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
    .pie{width:140px;height:140px;border-radius:50%;position:relative;background:conic-gradient(var(--accent) 0deg 0deg,color-mix(in srgb,var(--accent) 18%, var(--line)) 0deg 360deg);box-shadow:inset 0 0 0 14px color-mix(in srgb,var(--card) 100%, transparent), var(--soft)}
    .pie::after{content:'';position:absolute;inset:26px;border-radius:50%;background:var(--card);border:1px solid var(--line)}
    .pie-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:2;font-weight:900;font-size:24px}
    .legend{display:grid;gap:8px}
    .legend-item{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
    .legend-key{display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%}
    .accordion{display:grid;gap:10px}
    .budget-card{border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--card) 88%, transparent);overflow:hidden;box-shadow:var(--soft)}
    .accordion-toggle{width:100%;border:none;background:transparent;color:var(--text);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .budget-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .budget-body{display:none;padding:0 14px 14px}.budget-card.open .budget-body{display:block}
    .budget-headline{display:flex;flex-direction:column;align-items:flex-start;text-align:right}
    .stepper{display:flex;align-items:center;gap:8px;margin-top:10px}.step-btn{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%, transparent);color:var(--text);font-weight:900}.step-input{flex:1}
    .trx-actions{display:flex;gap:6px;flex-wrap:wrap}.more-btn,.ghost-link{height:38px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%, transparent);color:var(--text);font-weight:800;display:inline-flex;align-items:center;justify-content:center}
    .help-overlay,.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:120}
    .help-overlay.show,.modal-overlay.show{display:flex}
    .sheet{width:min(100%,880px);background:linear-gradient(180deg,var(--card),var(--card2));border-top-left-radius:24px;border-top-right-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;max-height:78vh;overflow:auto}
    .help-title{font-size:18px;font-weight:900;margin-bottom:8px}.help-body{color:var(--muted);font-size:14px;line-height:1.9}
    .helper-list{display:grid;gap:12px}
    .split{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}

    .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .summary-kpi{padding:12px 12px 10px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--card) 86%, transparent),color-mix(in srgb,var(--bg) 18%, transparent));box-shadow:var(--soft);text-align:center;min-height:92px;display:flex;flex-direction:column;justify-content:center}
    .summary-kpi .label{font-size:11px;color:var(--muted);margin-bottom:8px}
    .summary-kpi .value{font-size:18px;font-weight:950;line-height:1.3;letter-spacing:-.02em;word-break:break-word}
    .summary-kpi.net .value{font-size:20px}
    .pie-panel{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
    .pie{width:120px;height:120px;display:flex;align-items:center;justify-content:center}
    .pie::after{inset:22px}
    .pie-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1}
    .pie-center strong{font-size:34px;line-height:1}
    .pie-center span{font-size:12px;color:var(--muted);font-weight:800;margin-top:2px}
    .legend.compact{gap:7px}
    .legend.compact .legend-item{padding:8px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 60%, transparent)}
    .legend.compact .legend-item:last-child{border-bottom:none;padding-bottom:0}
    .trx-card{padding:13px 14px;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%, transparent);box-shadow:var(--soft);display:grid;gap:10px}
    .trx-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .trx-main{min-width:0}
    .trx-title{font-size:18px;font-weight:900;line-height:1.2;margin:0}
    .trx-meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
    .amount-pill{padding:8px 10px;border-radius:999px;font-size:13px;font-weight:900;border:1px solid var(--line);white-space:nowrap}
    .amount-pill.income{background:color-mix(in srgb,var(--ok) 12%, transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 24%, transparent)}
    .amount-pill.expense{background:color-mix(in srgb,var(--bg) 18%, transparent);color:var(--text)}
    .trx-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
    .section-head.tight{margin-bottom:10px}
    .fab{width:58px;height:58px;border-radius:20px;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom) + 18px);font-size:30px}
    .mini-btn{height:34px;padding:0 11px;font-size:13px}
    .top-actions{justify-content:flex-start}
    .accordion-list{display:grid;gap:10px}
    .accordion-chip{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
    @media (max-width:740px){.metric-grid,.g2,.g3,.ring-wrap,.pie-panel{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-top{flex-direction:column}.pie{margin:0 auto}.section-head{align-items:flex-start}.brand h1{font-size:31px}.summary-kpi .value{font-size:15px}.summary-kpi.net .value{font-size:18px}.tabs{gap:6px;padding:7px}.tab{min-height:50px}}
  </style>
</head>
<body class="theme-dark">
<div class="app">
  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <h1>هم‌بودجه</h1>
        <p>مدیریت دخل‌وخرج، بودجه، اقساط و صندوق‌های هدف‌دار</p>
      </div>
      <div class="version">نسخه v8.0.0</div>
    </div>
    <div class="top-actions">
      <button class="mini-btn primary" id="seedDemo"><span>✦</span><span>نمونه</span></button>
      <button class="mini-btn" id="themeToggle"><span id="themeIcon">☀️</span><span id="themeLabel">روشن</span></button>
    </div>
  </header>
  <section id="screen-dashboard" class="screen active"></section>
  <section id="screen-transactions" class="screen"></section>
  <section id="screen-budgets" class="screen"></section>
  <section id="screen-funds" class="screen"></section>
  <section id="screen-reports" class="screen"></section>
</div>
<button class="fab" id="quickAdd" aria-label="افزودن تراکنش">＋</button>
<div class="tabs-wrap"><nav class="tabs" id="tabs"></nav></div>
<div class="help-overlay" id="helpOverlay"><div class="sheet"><div class="row" style="margin-bottom:10px"><div class="help-title" id="helpTitle">راهنما</div><button class="mini-btn" id="closeHelp">بستن</button></div><div class="help-body" id="helpBody"></div></div></div>
<div class="modal-overlay" id="modalOverlay"><div class="sheet" id="modalSheet"></div></div>
<script>
const KEY='hambodje.v8';
const THEME_KEY='hambodje.theme';
const baseCategories=['مسکن','خوراک','حمل‌ونقل','درمان','آموزش','خانواده','ارتباطات','تفریح','بدهی','پس‌انداز'];
const incomeCategory='درآمد';
const tabs=[['dashboard','داشبورد','⌂'],['transactions','تراکنش‌ها','⇄'],['budgets','بودجه','◫'],['funds','صندوق‌ها','◌'],['reports','گزارش','◔']];
const helpText={
  dashboard:'داشبورد نمای کلی ماه جاری را نشان می‌دهد: مانده، درآمد، هزینه، مصرف بودجه و آخرین تراکنش‌ها. برای جزئیات بیشتر از دکمه «بیشتر» استفاده کنید.',
  dashboard_budget:'این نمودار دایره‌ای نشان می‌دهد چه مقدار از بودجه ماه جاری مصرف شده است و سهم دسته‌های اصلی چگونه توزیع شده.',
  dashboard_transactions:'فقط دو تراکنش آخر نمایش داده می‌شود تا صفحه شلوغ نشود. با «بیشتر» فهرست کامل باز می‌شود.',
  transactions:'در این بخش می‌توانی درآمد و هزینه ثبت کنی، تراکنش‌ها را ویرایش کنی یا حذف کنی. ورود عددی با تومان انجام می‌شود.',
  budgets:'برای هر دسته یک آیتم کشویی داری. مقدار بودجه را با دکمه‌های کم/زیاد تنظیم کن، عنوان را ویرایش کن یا با دکمه «بودجه جدید» دسته تازه بساز.',
  funds:'اینجا صندوق‌های هدف‌دار و اقساط به‌صورت کشویی نمایش داده می‌شوند. هر مورد را می‌توان باز کرد، ویرایش کرد یا حذف کرد.',
  reports:'گزارش‌ها جمع‌بندی روند، سهم دسته‌ها و پیشنهاد عملی را نشان می‌دهند. دکمه‌های i کنار هر بخش توضیح همان قسمت را باز می‌کنند.',
  reports_summary:'این بخش میانگین‌ها و پیش‌بینی ۳۰ روزه را نشان می‌دهد تا فشار نقدینگی سریع دیده شود.',
  reports_categories:'در این بخش سهم هر دسته از هزینه‌های ماه جاری نمایش داده می‌شود.',
  reports_advice:'خروجی این بخش بر اساس وضعیت فعلی بودجه و جریان نقد، یک پیشنهاد عملی کوتاه می‌دهد.'
};
const state=loadState();
let editingTransactionId=null;
let editingFundId=null;
let editingInstallmentId=null;
let showAllTransactions=false;
function id(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function toNum(v){ if(v===undefined||v===null) return 0; return Number(String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/,/g,'').trim())||0; }
function fmt(n){ return new Intl.NumberFormat('fa-IR').format(Math.round(n||0)); }
function todayShamsi(){ const s=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); const nums=String(s).match(/[۰-۹0-9]+/g)||[]; return nums.join('/'); }
function loadState(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const obj=JSON.parse(raw); return {activeTab:'dashboard',transactions:[],budgets:{},funds:[],installments:[],customBudgetCats:[],...obj}; } }catch(e){} return {activeTab:'dashboard',transactions:[],budgets:{},funds:[],installments:[],customBudgetCats:[]}; }
function saveState(){ localStorage.setItem(KEY,JSON.stringify(state)); render(); }
function currentMonth(){ const p=todayShamsi().split('/'); return `${p[0]}/${p[1]}`; }
function lastMonths(n){ const out=[]; const now=new Date(); for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); const s=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit'}).format(d); const nums=String(s).match(/[۰-۹0-9]+/g)||[]; out.push(nums.join('/')); } return out; }
function budgetKey(month,cat){ return `${month}|${cat}`; }

function expenseCategories(){ return Array.from(new Set([...baseCategories, ...(state.customBudgetCats||[])])); }
function transactionCategories(){ return [...expenseCategories(), incomeCategory]; }

function planned(cat,month=currentMonth()){ return toNum(state.budgets[budgetKey(month,cat)]); }
function monthOfDate(date){ const p=(date||'').split('/'); return p.length>=2 ? `${p[0]}/${p[1]}`:''; }
function monthIncome(month=currentMonth()){ return state.transactions.filter(t=>monthOfDate(t.date)===month&&t.type==='income').reduce((a,b)=>a+b.amount,0); }
function monthExpense(month=currentMonth()){ return state.transactions.filter(t=>monthOfDate(t.date)===month&&t.type==='expense').reduce((a,b)=>a+b.amount,0); }
function categorySpent(cat,month=currentMonth()){ return state.transactions.filter(t=>monthOfDate(t.date)===month&&t.type==='expense'&&t.category===cat).reduce((a,b)=>a+b.amount,0); }
function averageMonthlyIncome(n=3){ const ms=lastMonths(n); return Math.round(ms.reduce((a,m)=>a+monthIncome(m),0)/Math.max(1,ms.length)); }
function averageMonthlyExpense(n=3){ const ms=lastMonths(n); return Math.round(ms.reduce((a,m)=>a+monthExpense(m),0)/Math.max(1,ms.length)); }
function forecast30(){ const m=currentMonth(); const income=monthIncome(m), expense=monthExpense(m); const upcomingInstallments=state.installments.reduce((a,b)=>a+(b.active!==false?toNum(b.monthlyAmount):0),0); const monthlyFunds=state.funds.reduce((a,b)=>a+toNum(b.monthlyRequired),0); return income - expense - upcomingInstallments - monthlyFunds; }
function computeBudgetSuggestion(cat){ const avg3=Math.round(lastMonths(3).reduce((a,m)=>a+categorySpent(cat,m),0)/3); return Math.max(avg3,Math.round(averageMonthlyExpense(3)/8)); }
function remaining(cat,month=currentMonth()){ return planned(cat,month)-categorySpent(cat,month); }
function statusClass(used,plan){ if(!plan) return ''; const ratio=used/plan; if(ratio>1) return 'color:var(--danger)'; if(ratio>=.85) return 'color:var(--warn)'; return 'color:var(--ok)'; }

function openEditFund(fid){ const f=state.funds.find(x=>x.id===fid); if(!f) return; openModal(`<div class="row" style="margin-bottom:12px"><strong>ویرایش صندوق</strong><button class="mini-btn" id="closeModalBtn">بستن</button></div><div class="grid g2"><div><label>عنوان</label><input id="mf-title" value="${f.title}"></div><div><label>هدف</label><input id="mf-target" inputmode="numeric" value="${f.targetAmount}"></div><div><label>ذخیره فعلی</label><input id="mf-saved" inputmode="numeric" value="${f.savedAmount}"></div><div><label>سررسید</label><input id="mf-due" value="${f.dueDate||''}"></div><div><label>نیاز ماهانه</label><input id="mf-monthly" inputmode="numeric" value="${f.monthlyRequired}"></div></div><div class="inline-actions" style="margin-top:12px"><button class="btn primary" id="saveFundEdit">ذخیره</button></div>`); document.getElementById('closeModalBtn').onclick=closeModal; document.getElementById('saveFundEdit').onclick=()=>{ f.title=mfTitle.value.trim(); f.targetAmount=toNum(mfTarget.value); f.savedAmount=toNum(mfSaved.value); f.dueDate=mfDue.value.trim(); f.monthlyRequired=toNum(mfMonthly.value); closeModal(); saveState(); }; }
function openEditInstallment(iid){ const it=state.installments.find(x=>x.id===iid); if(!it) return; openModal(`<div class="row" style="margin-bottom:12px"><strong>ویرایش قسط</strong><button class="mini-btn" id="closeModalBtn">بستن</button></div><div class="grid g2"><div><label>عنوان</label><input id="mi-title" value="${it.title}"></div><div><label>مبلغ ماهانه</label><input id="mi-monthly" inputmode="numeric" value="${it.monthlyAmount}"></div><div><label>مانده</label><input id="mi-remain" inputmode="numeric" value="${it.remainingBalance}"></div><div><label>سررسید</label><input id="mi-due" value="${it.dueDate||''}"></div></div><div class="inline-actions" style="margin-top:12px"><button class="btn primary" id="saveInstallmentEdit">ذخیره</button></div>`); document.getElementById('closeModalBtn').onclick=closeModal; document.getElementById('saveInstallmentEdit').onclick=()=>{ it.title=miTitle.value.trim(); it.monthlyAmount=toNum(miMonthly.value); it.remainingBalance=toNum(miRemain.value); it.dueDate=miDue.value.trim(); closeModal(); saveState(); }; }
function renderReports(){ const months=lastMonths(6); const rows=months.map(m=>({m,income:monthIncome(m),expense:monthExpense(m)})); const totalExp=rows.reduce((a,b)=>a+b.expense,0)||1; const cats=expenseCategories().map(c=>({cat:c,spent:categorySpent(c,currentMonth())})).filter(x=>x.spent).sort((a,b)=>b.spent-a.spent); reports.innerHTML=`
<div class="card">
  <div class="section-head"><div><div class="title-wrap"><div class="section-title">جمع‌بندی</div>${infoBtn('reports_summary')}</div><div class="section-sub">میانگین‌ها و برآورد نقدینگی</div></div></div>
  <div class="grid g3"><div class="metric"><div class="label">میانگین درآمد ۳ ماه</div><div class="value">${fmt(averageMonthlyIncome(3))}</div></div><div class="metric"><div class="label">میانگین هزینه ۳ ماه</div><div class="value">${fmt(averageMonthlyExpense(3))}</div></div><div class="metric"><div class="label">پیش‌بینی ۳۰ روزه</div><div class="value" style="${forecast30()<0?'color:var(--danger)':'color:var(--ok)'}">${fmt(forecast30())}</div></div></div>
</div>
<div class="card">
  <div class="section-head"><div><div class="title-wrap"><div class="section-title">روند ۶ ماهه</div>${infoBtn('reports')}</div><div class="section-sub">درآمد، هزینه و خالص ماهانه</div></div></div>
  <table><thead><tr><th>ماه</th><th>درآمد</th><th>هزینه</th><th>خالص</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.m}</td><td>${fmt(r.income)}</td><td>${fmt(r.expense)}</td><td style="color:${r.income-r.expense<0?'var(--danger)':'var(--ok)'}">${fmt(r.income-r.expense)}</td></tr>`).join('')}</tbody></table>
</div>
<div class="card">
  <div class="section-head"><div><div class="title-wrap"><div class="section-title">سهم دسته‌های این ماه</div>${infoBtn('reports_categories')}</div><div class="section-sub">بیشترین دسته‌های مصرف‌کننده بودجه</div></div></div>
  <div class="list">${cats.length?cats.map(c=>`<div class="item"><div class="row"><strong>${c.cat}</strong><span>${fmt(Math.round((c.spent/((cats.reduce((a,b)=>a+b.spent,0))||1))*100))}٪</span></div><div class="sm muted">${fmt(c.spent)} تومان</div><div class="progress"><span style="width:${Math.round((c.spent/((cats.reduce((a,b)=>a+b.spent,0))||1))*100)}%"></span></div></div>`).join(''):'<div class="empty">برای این ماه داده‌ای وجود ندارد.</div>'}</div>
</div>
<div class="card">
  <div class="section-head"><div><div class="title-wrap"><div class="section-title">پیشنهاد عملی</div>${infoBtn('reports_advice')}</div><div class="section-sub">خلاصه تصمیم پیشنهادی بر اساس داده فعلی</div></div></div>
  <div class="notice">${generateAdvice()}</div>
  <div class="inline-actions" style="margin-top:12px"><button class="btn secondary" id="exportBtn">خروجی JSON</button><button class="btn danger" id="resetBtn">پاک‌سازی کامل</button></div>
</div>`;
 document.getElementById('exportBtn').onclick=()=>{ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hambodje-backup.json'; a.click(); URL.revokeObjectURL(a.href); };
 document.getElementById('resetBtn').onclick=()=>{ if(confirm('همه داده‌ها پاک شود؟')){ localStorage.removeItem(KEY); location.reload(); } };
 attachInfoButtons(); }
function generateAdvice(){ const month=currentMonth(); const income=monthIncome(month), expense=monthExpense(month); const over=expenseCategories().map(c=>({c,p:planned(c,month),s:categorySpent(c,month)})).filter(x=>x.p>0&&x.s>x.p).sort((a,b)=>(b.s-b.p)-(a.s-a.p))[0]; if(forecast30()<0) return 'پیش‌بینی ۳۰ روزه منفی است. فعلاً واریزی صندوق‌های کم‌اولویت را پایین بیاور یا بودجه دسته‌های غیرضروری را کم کن.'; if(over) return `بیشترین انحراف مربوط به «${over.c}» است. اولویت با کنترل همین دسته یا انتقال بودجه از دسته‌های کم‌مصرف است.`; if(income>0 && expense/income<0.7) return 'وضعیت ماه جاری کنترل‌شده است. اقدام مناسب بعدی، تقویت صندوق اضطراری یا تسویه بخشی از بدهی است.'; return 'اطلاعات کافی برای توصیه دقیق‌تر نیست. چند تراکنش و بودجه بیشتر ثبت کن.'; }

document.getElementById('seedDemo').addEventListener('click', seedDemoFn);
document.getElementById('quickAdd').addEventListener('click', ()=>setActiveTab('transactions'));

closeHelp.addEventListener('click', closeHelpModal);
helpOverlay.addEventListener('click', (e)=>{ if(e.target===helpOverlay) closeHelpModal(); });
modalOverlay.addEventListener('click', (e)=>{ if(e.target===modalOverlay) closeModal(); });
loadTheme(); render();
</script>
