<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>هم‌بودجه</title>
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg:#f4f7fb; --card:#ffffff; --line:#dbe4ef; --text:#0f172a; --muted:#64748b;
  --accent:#0f766e; --accent2:#0b5f59; --danger:#b91c1c; --ok:#15803d; --warn:#b45309;
  --shadow:0 10px 24px rgba(15,23,42,.08); --radius:18px;
}
body.dark {
  --bg:#0b1220; --card:#121b2d; --line:#24324d; --text:#e5eefc; --muted:#9db0ce;
  --accent:#14b8a6; --accent2:#0f9488; --shadow:0 12px 30px rgba(0,0,0,.30);
}
* {box-sizing:border-box; -webkit-tap-highlight-color: transparent}
html, body {height:100%}
body {margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); transition:background .2s, color .2s}
.app {max-width:840px; margin:0 auto; padding:14px 14px 100px}
.header {display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:12px}
.title {font-size:30px; font-weight:900; line-height:1.1}
.sub {font-size:13px; color:var(--muted); margin-top:6px}
.badge {display:inline-block; font-size:11px; padding:4px 8px; border:1px solid var(--line); border-radius:999px; color:var(--muted); margin-top:8px}
.actions {display:flex; gap:8px; flex-wrap:wrap}
.card {background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
.metric-grid {display:grid; gap:10px; grid-template-columns:repeat(3,1fr)}
.metric {border:1px solid var(--line); border-radius:16px; padding:12px}
.metric .label {font-size:12px; color:var(--muted); margin-bottom:6px}
.metric .value {font-size:22px; font-weight:800}
.grid2 {display:grid; gap:10px; grid-template-columns:1fr 1fr}
.list {display:grid; gap:10px}
.item {border:1px solid var(--line); border-radius:16px; padding:12px}
.row {display:flex; justify-content:space-between; align-items:center; gap:10px}
.wrap {flex-wrap:wrap}
label {display:block; font-size:12px; color:var(--muted); margin:0 0 6px}
input, select, textarea, button {font:inherit}
input, select, textarea {
  width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:14px;
  background:var(--card); color:var(--text);
}
button {border:none; border-radius:14px; padding:12px 14px; font-weight:800; cursor:pointer}
.btn {background:var(--accent); color:#fff}
.btn:hover {background:var(--accent2)}
.btn.secondary {background:transparent; color:var(--text); border:1px solid var(--line)}
.btn.ghost {background:transparent; color:var(--muted); border:1px dashed var(--line)}
.fab {
  position:fixed; left:16px; bottom:84px; width:58px; height:58px; border-radius:50%;
  display:grid; place-items:center; background:var(--accent); color:#fff; font-size:34px; box-shadow:var(--shadow);
}
.tabs {
  position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(5,1fr); gap:8px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.88); backdrop-filter:blur(14px); border-top:1px solid var(--line);
}
body.dark .tabs {background:rgba(11,18,32,.88)}
.tab {background:var(--card); border:1px solid var(--line); padding:10px 8px; border-radius:14px; text-align:center; font-size:12px; color:var(--muted)}
.tab.active {background:var(--accent); color:#fff; border-color:transparent}
.screen {display:none}
.screen.active {display:block}
.section-title {font-size:18px; font-weight:900; margin:0 0 12px}
.muted {color:var(--muted)}
.empty {padding:18px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:16px}
.progress {height:10px; background:#e8edf5; border-radius:999px; overflow:hidden}
.progress > span {display:block; height:100%; background:var(--accent); border-radius:999px}
.notice {padding:10px 12px; border:1px solid var(--line); border-radius:14px}
.ok {color:var(--ok)} .danger {color:var(--danger)} .warn {color:var(--warn)}
.small {font-size:12px}
table {width:100%; border-collapse:collapse}
th, td {padding:10px 8px; border-bottom:1px solid var(--line); text-align:right; font-size:13px}
th {color:var(--muted)}
.debug {font-size:12px; color:var(--muted); white-space:pre-wrap; max-height:140px; overflow:auto}
@media (max-width:640px) {
  .metric-grid, .grid2 {grid-template-columns:1fr}
  .header {flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="title">هم‌بودجه</div>
      <div class="sub">مدیریت دخل‌وخرج، بودجه، اقساط و صندوق‌های هدف‌دار</div>
      <div class="badge">نسخه v5.0.0</div>
    </div>
    <div class="actions">
      <button type="button" class="btn secondary" id="themeBtn">🌙 تم</button>
      <button type="button" class="btn secondary" id="demoBtn">داده نمونه</button>
    </div>
  </div>

  <section id="dashboard" class="screen active"></section>
  <section id="transactions" class="screen"></section>
  <section id="budgets" class="screen"></section>
  <section id="funds" class="screen"></section>
  <section id="reports" class="screen"></section>
</div>

<button type="button" class="fab" id="addBtn">+</button>
<nav class="tabs" id="tabs"></nav>

<script>
(() => {
  'use strict';
  const APP_KEY = 'hambodje.single.v5';
  const THEME_KEY = 'hambodje.theme.v5';
  const VERSION = 'v5.0.0';
  const categories = ['مسکن','خوراک','حمل‌ونقل','درمان','آموزش','خانواده','ارتباطات','تفریح','بدهی','پس‌انداز','درآمد'];
  const tabs = [
    ['dashboard','داشبورد'],
    ['transactions','تراکنش‌ها'],
    ['budgets','بودجه'],
    ['funds','صندوق‌ها'],
    ['reports','گزارش']
  ];
  const logBuffer = [];
  function log(msg) {
    const line = new Date().toLocaleTimeString('fa-IR') + ' | ' + msg;
    logBuffer.unshift(line);
    if (logBuffer.length > 20) logBuffer.pop();
    const el = document.getElementById('debugBox');
    if (el) el.textContent = logBuffer.join('\n');
  }
  function fmt(n) {
    return new Intl.NumberFormat('fa-IR').format(Math.round(Number(n || 0)));
  }
  function toNum(v) {
    if (v == null) return 0;
    const fa = '۰۱۲۳۴۵۶۷۸۹';
    return Number(String(v).replace(/[۰-۹]/g, d => fa.indexOf(d)).replace(/,/g, '').trim()) || 0;
  }
  function today() {
    const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date()).match(/[۰-۹0-9]+/g) || [];
    const nums = parts.map(p => String(toNum(p)).padStart(2,'0'));
    return nums.join('/');
  }
  function currentMonth() {
    return today().slice(0, 7);
  }
  function monthOf(date) {
    return String(date || '').slice(0, 7);
  }
  function uid() {
    return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
  }
  function defaultState() {
    return {
      version: VERSION,
      activeTab: 'dashboard',
      accounts: [{id: uid(), name: 'بانک اصلی', openingBalance: 0}],
      transactions: [],
      budgets: {},
      funds: [],
      installments: []
    };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(APP_KEY);
      if (!raw) return defaultState();
      const data = JSON.parse(raw);
      return Object.assign(defaultState(), data || {});
    } catch (e) {
      return defaultState();
    }
  }
  const state = loadState();
  function saveState() {
    localStorage.setItem(APP_KEY, JSON.stringify(state));
    render();
    log('ذخیره شد');
  }
  function budgetKey(month, cat) {
    return month + '|' + cat;
  }
  function planned(cat, month=currentMonth()) {
    return toNum(state.budgets[budgetKey(month, cat)] || 0);
  }
  function monthTransactions(month=currentMonth()) {
    return state.transactions.filter(t => monthOf(t.date) === month);
  }
  function monthIncome(month=currentMonth()) {
    return monthTransactions(month).filter(t => t.type === 'income').reduce((a,t) => a + toNum(t.amount), 0);
  }
  function monthExpense(month=currentMonth()) {
    return monthTransactions(month).filter(t => t.type === 'expense').reduce((a,t) => a + toNum(t.amount), 0);
  }
  function categorySpent(cat, month=currentMonth()) {
    return monthTransactions(month).filter(t => t.type === 'expense' && t.category === cat).reduce((a,t) => a + toNum(t.amount), 0);
  }
  function totalBalance() {
    const opening = state.accounts.reduce((a,x) => a + toNum(x.openingBalance), 0);
    const delta = state.transactions.reduce((a,t) => a + (t.type === 'income' ? toNum(t.amount) : -toNum(t.amount)), 0);
    return opening + delta;
  }
  function forecast30() {
    const inc = monthIncome();
    const exp = monthExpense();
    const inst = state.installments.reduce((a,x) => a + toNum(x.monthlyAmount), 0);
    const fund = state.funds.reduce((a,x) => a + toNum(x.monthlyRequired), 0);
    return totalBalance() + inc - exp - inst - fund;
  }
  function applyTheme(theme) {
    const t = theme || localStorage.getItem(THEME_KEY) || 'light';
    document.body.classList.toggle('dark', t === 'dark');
    localStorage.setItem(THEME_KEY, t);
    const b = document.getElementById('themeBtn');
    if (b) b.textContent = t === 'dark' ? '☀️ تم' : '🌙 تم';
    log('تم: ' + t);
  }
  function switchTab(name) {
    state.activeTab = name;
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(name);
    if (target) target.classList.add('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    renderTab(name);
    log('تب: ' + name);
  }
  function seedDemoData() {
    if (state.transactions.length || state.funds.length || state.installments.length) {
      if (!confirm('داده فعلی پاک و نمونه جایگزین شود؟')) return;
    }
    state.accounts = [{id: uid(), name: 'بانک اصلی', openingBalance: 120000000}];
    state.transactions = [
      {id: uid(), type:'income', amount:85000000, category:'درآمد', date: currentMonth() + '/01', note:'حقوق'},
      {id: uid(), type:'expense', amount:12000000, category:'خوراک', date: currentMonth() + '/03', note:'سوپرمارکت'},
      {id: uid(), type:'expense', amount:5000000, category:'حمل‌ونقل', date: currentMonth() + '/05', note:'بنزین'},
      {id: uid(), type:'expense', amount:26000000, category:'مسکن', date: currentMonth() + '/07', note:'اجاره'}
    ];
    state.budgets = {};
    state.budgets[budgetKey(currentMonth(),'خوراک')] = 15000000;
    state.budgets[budgetKey(currentMonth(),'حمل‌ونقل')] = 6000000;
    state.budgets[budgetKey(currentMonth(),'مسکن')] = 26000000;
    state.budgets[budgetKey(currentMonth(),'درمان')] = 3000000;
    state.funds = [{id: uid(), title:'بیمه خودرو', targetAmount:30000000, savedAmount:12000000, dueDate:'1406/02/15', monthlyRequired:3000000}];
    state.installments = [{id: uid(), title:'قسط خودرو', monthlyAmount:8500000, remainingBalance:187000000, dueDate: currentMonth() + '/18'}];
    saveState();
    switchTab('dashboard');
    log('داده نمونه بارگذاری شد');
    alert('داده نمونه با موفقیت بارگذاری شد.');
  }
  function makeTabs() {
    const root = document.getElementById('tabs');
    root.innerHTML = tabs.map(([k, label]) => `<button type="button" class="tab ${state.activeTab===k?'active':''}" data-tab="${k}">${label}</button>`).join('');
    root.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
  }
  function renderDashboard() {
    const month = currentMonth();
    const exp = monthExpense(month);
    const inc = monthIncome(month);
    const remain = inc - exp;
    const alerts = [];
    if (forecast30() < 0) alerts.push('پیش‌بینی ۳۰ روزه منفی است.');
    const foodPlan = planned('خوراک', month);
    if (foodPlan && categorySpent('خوراک', month) >= foodPlan * 0.85) alerts.push('بودجه خوراک نزدیک سقف است.');
    if (state.installments.length) alerts.push('نزدیک‌ترین سررسید: ' + state.installments[0].title + ' - ' + state.installments[0].dueDate);
    document.getElementById('dashboard').innerHTML = `
      <div class="card">
        <div class="metric-grid">
          <div class="metric"><div class="label">مانده کل</div><div class="value">${fmt(totalBalance())}</div></div>
          <div class="metric"><div class="label">درآمد این ماه</div><div class="value">${fmt(inc)}</div></div>
          <div class="metric"><div class="label">هزینه این ماه</div><div class="value">${fmt(exp)}</div></div>
        </div>
      </div>
      <div class="card">
        <div class="metric-grid">
          <div class="metric"><div class="label">باقی‌مانده این ماه</div><div class="value">${fmt(remain)}</div></div>
          <div class="metric"><div class="label">پیش‌بینی ۳۰ روزه</div><div class="value ${forecast30()<0?'danger':'ok'}">${fmt(forecast30())}</div></div>
          <div class="metric"><div class="label">نسخه</div><div class="value" style="font-size:16px">${VERSION}</div></div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">هشدارها</div>
        <div class="list">${alerts.length ? alerts.map(a => `<div class="notice">${a}</div>`).join('') : '<div class="empty">هشدار مهمی وجود ندارد.</div>'}</div>
      </div>
      <div class="card">
        <div class="section-title">راهنمای تست</div>
        <div class="small muted">۱) روی «داده نمونه» بزن. ۲) روی «+» بزن. ۳) باید فرم تراکنش باز شود. ۴) نسخه باید v5.0.0 باشد.</div>
      </div>
    `;
  }
  function renderTransactions() {
    document.getElementById('transactions').innerHTML = `
      <div class="card">
        <div class="section-title">ثبت تراکنش</div>
        <div class="grid2">
          <div><label>نوع</label><select id="tr-type"><option value="expense">هزینه</option><option value="income">درآمد</option></select></div>
          <div><label>مبلغ</label><input id="tr-amount" inputmode="numeric" placeholder="مثلاً 2500000"></div>
          <div><label>دسته</label><select id="tr-category">${categories.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
          <div><label>تاریخ</label><input id="tr-date" value="${today()}"></div>
          <div style="grid-column:1/-1"><label>یادداشت</label><input id="tr-note" placeholder="اختیاری"></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button type="button" class="btn" id="saveTransactionBtn">ذخیره تراکنش</button>
          <button type="button" class="btn ghost" id="newAccountBtn">افزودن حساب</button>
        </div>
      </div>
      <div class="card">
        <div class="section-title">آخرین تراکنش‌ها</div>
        <div class="list">
          ${
            state.transactions.length
              ? state.transactions.slice().reverse().map(t => `
                <div class="item">
                  <div class="row">
                    <strong>${t.type === 'income' ? 'درآمد' : 'هزینه'} - ${t.category}</strong>
                    <button type="button" class="btn ghost del-transaction" data-id="${t.id}">حذف</button>
                  </div>
                  <div class="small muted">${t.date} | ${fmt(t.amount)} | ${t.note || '-'}</div>
                </div>
              `).join('')
              : '<div class="empty">تراکنشی ثبت نشده است.</div>'
          }
        </div>
      </div>
    `;
    document.getElementById('saveTransactionBtn').addEventListener('click', () => {
      const type = document.getElementById('tr-type').value;
      const amount = toNum(document.getElementById('tr-amount').value);
      const category = document.getElementById('tr-category').value;
      const date = document.getElementById('tr-date').value.trim() || today();
      const note = document.getElementById('tr-note').value.trim();
      if (!amount) {
        alert('مبلغ معتبر نیست.');
        return;
      }
      state.transactions.push({id: uid(), type, amount, category, date, note});
      saveState();
      alert('تراکنش ذخیره شد.');
    });
    document.getElementById('newAccountBtn').addEventListener('click', () => {
      const name = prompt('نام حساب');
      if (!name) return;
      const openingBalance = toNum(prompt('موجودی اولیه') || '0');
      state.accounts.push({id: uid(), name, openingBalance});
      saveState();
    });
    document.querySelectorAll('.del-transaction').forEach(btn => btn.addEventListener('click', () => {
      state.transactions = state.transactions.filter(t => t.id !== btn.dataset.id);
      saveState();
    }));
  }
  function budgetSuggestion(cat) {
    if (cat === 'مسکن') return 26000000;
    const hist = state.transactions.filter(t => t.type === 'expense' && t.category === cat);
    if (!hist.length) return 0;
    const avg = hist.reduce((a,t) => a + toNum(t.amount), 0) / hist.length;
    return Math.round(avg * 1.2);
  }
  function renderBudgets() {
    const month = currentMonth();
    const list = categories.filter(c => c !== 'درآمد');
    document.getElementById('budgets').innerHTML = `
      <div class="card">
        <div class="row wrap">
          <div class="section-title">بودجه ماه ${month}</div>
          <button type="button" class="btn secondary" id="autoBudgetBtn">پیشنهاد خودکار</button>
        </div>
        <div class="grid2">
          ${list.map(cat => `<div><label>${cat}</label><input class="budget-input" data-cat="${cat}" inputmode="numeric" value="${planned(cat, month) || ''}" placeholder="${budgetSuggestion(cat) || 0}"></div>`).join('')}
        </div>
        <div class="row" style="margin-top:12px"><button type="button" class="btn" id="saveBudgetBtn">ذخیره بودجه‌ها</button></div>
      </div>
      <div class="card">
        <div class="section-title">وضعیت عملکرد</div>
        <table>
          <thead><tr><th>دسته</th><th>بودجه</th><th>خرج</th><th>مانده</th></tr></thead>
          <tbody>
            ${list.map(cat => {
              const p = planned(cat, month);
              const s = categorySpent(cat, month);
              const r = p - s;
              return `<tr><td>${cat}</td><td>${fmt(p)}</td><td>${fmt(s)}</td><td class="${r<0?'danger':'ok'}">${fmt(r)}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
    document.getElementById('autoBudgetBtn').addEventListener('click', () => {
      document.querySelectorAll('.budget-input').forEach(inp => inp.value = budgetSuggestion(inp.dataset.cat) || '');
      log('پیشنهاد بودجه اعمال شد');
    });
    document.getElementById('saveBudgetBtn').addEventListener('click', () => {
      document.querySelectorAll('.budget-input').forEach(inp => {
        state.budgets[budgetKey(month, inp.dataset.cat)] = toNum(inp.value);
      });
      saveState();
      alert('بودجه‌ها ذخیره شد.');
    });
  }
  function renderFunds() {
    document.getElementById('funds').innerHTML = `
      <div class="card">
        <div class="section-title">افزودن صندوق هدف‌دار</div>
        <div class="grid2">
          <div><label>عنوان</label><input id="fund-title" placeholder="مثلاً بیمه خودرو"></div>
          <div><label>هدف</label><input id="fund-target" inputmode="numeric"></div>
          <div><label>ذخیره فعلی</label><input id="fund-saved" inputmode="numeric"></div>
          <div><label>سررسید</label><input id="fund-due" placeholder="1406/02/15"></div>
          <div><label>نیاز ماهانه</label><input id="fund-monthly" inputmode="numeric"></div>
        </div>
        <div class="row" style="margin-top:12px"><button type="button" class="btn" id="saveFundBtn">افزودن صندوق</button></div>
      </div>
      <div class="card">
        <div class="section-title">افزودن قسط</div>
        <div class="grid2">
          <div><label>عنوان</label><input id="ins-title" placeholder="قسط خودرو"></div>
          <div><label>قسط ماهانه</label><input id="ins-monthly" inputmode="numeric"></div>
          <div><label>مانده</label><input id="ins-remain" inputmode="numeric"></div>
          <div><label>سررسید</label><input id="ins-due" placeholder="${currentMonth()}/18"></div>
        </div>
        <div class="row" style="margin-top:12px"><button type="button" class="btn" id="saveInstallmentBtn">افزودن قسط</button></div>
      </div>
      <div class="card">
        <div class="section-title">لیست صندوق‌ها</div>
        <div class="list">
          ${
            state.funds.length
              ? state.funds.map(f => {
                  const p = f.targetAmount ? Math.min(100, Math.round((toNum(f.savedAmount)/toNum(f.targetAmount))*100)) : 0;
                  return `<div class="item"><div class="row"><strong>${f.title}</strong><button type="button" class="btn ghost del-fund" data-id="${f.id}">حذف</button></div><div class="small muted">هدف: ${fmt(f.targetAmount)} | ذخیره: ${fmt(f.savedAmount)} | سررسید: ${f.dueDate}</div><div class="small muted">نیاز ماهانه: ${fmt(f.monthlyRequired)}</div><div class="progress"><span style="width:${p}%"></span></div></div>`;
                }).join('')
              : '<div class="empty">صندوقی ثبت نشده است.</div>'
          }
        </div>
      </div>
      <div class="card">
        <div class="section-title">لیست اقساط</div>
        <div class="list">
          ${
            state.installments.length
              ? state.installments.map(i => `<div class="item"><div class="row"><strong>${i.title}</strong><button type="button" class="btn ghost del-ins" data-id="${i.id}">حذف</button></div><div class="small muted">قسط ماهانه: ${fmt(i.monthlyAmount)} | مانده: ${fmt(i.remainingBalance)} | سررسید: ${i.dueDate}</div></div>`).join('')
              : '<div class="empty">قسطی ثبت نشده است.</div>'
          }
        </div>
      </div>
    `;
    document.getElementById('saveFundBtn').addEventListener('click', () => {
      const title = document.getElementById('fund-title').value.trim();
      const targetAmount = toNum(document.getElementById('fund-target').value);
      const savedAmount = toNum(document.getElementById('fund-saved').value);
      const dueDate = document.getElementById('fund-due').value.trim();
      const monthlyRequired = toNum(document.getElementById('fund-monthly').value);
      if (!title || !targetAmount) {
        alert('اطلاعات صندوق ناقص است.');
        return;
      }
      state.funds.push({id: uid(), title, targetAmount, savedAmount, dueDate, monthlyRequired});
      saveState();
      alert('صندوق ذخیره شد.');
    });
    document.getElementById('saveInstallmentBtn').addEventListener('click', () => {
      const title = document.getElementById('ins-title').value.trim();
      const monthlyAmount = toNum(document.getElementById('ins-monthly').value);
      const remainingBalance = toNum(document.getElementById('ins-remain').value);
      const dueDate = document.getElementById('ins-due').value.trim();
      if (!title || !monthlyAmount) {
        alert('اطلاعات قسط ناقص است.');
        return;
      }
      state.installments.push({id: uid(), title, monthlyAmount, remainingBalance, dueDate});
      saveState();
      alert('قسط ذخیره شد.');
    });
    document.querySelectorAll('.del-fund').forEach(btn => btn.addEventListener('click', () => {
      state.funds = state.funds.filter(x => x.id !== btn.dataset.id);
      saveState();
    }));
    document.querySelectorAll('.del-ins').forEach(btn => btn.addEventListener('click', () => {
      state.installments = state.installments.filter(x => x.id !== btn.dataset.id);
      saveState();
    }));
  }
  function generateAdvice() {
    if (forecast30() < 0) return 'پیش‌بینی ۳۰ روزه منفی است. هزینه‌های غیرضروری را کم کن یا واریزی صندوق‌های کم‌اولویت را موقتاً کاهش بده.';
    if (state.installments.length) return 'اولویت فعلی: مطمئن شو قسط نزدیک را قبل از هر هزینه اختیاری پوشش داده‌ای.';
    if (monthExpense() > monthIncome()) return 'هزینه ماه از درآمد جلو زده است. سقف بودجه چند دسته باید پایین بیاید.';
    return 'وضعیت فعلی قابل‌قبول است. اکنون بهترین کار ساخت صندوق اضطراری یا افزایش پس‌انداز است.';
  }
  function renderReports() {
    document.getElementById('reports').innerHTML = `
      <div class="card">
        <div class="section-title">جمع‌بندی</div>
        <div class="metric-grid">
          <div class="metric"><div class="label">میانگین درآمد</div><div class="value">${fmt(monthIncome())}</div></div>
          <div class="metric"><div class="label">میانگین هزینه</div><div class="value">${fmt(monthExpense())}</div></div>
          <div class="metric"><div class="label">پیش‌بینی ۳۰ روزه</div><div class="value ${forecast30()<0?'danger':'ok'}">${fmt(forecast30())}</div></div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">پیشنهاد عملی</div>
        <div class="notice">${generateAdvice()}</div>
      </div>
      <div class="card">
        <div class="row wrap">
          <div class="section-title">پشتیبان و دیباگ</div>
          <div class="small muted">این جعبه برای اطمینان از کارکرد JS است.</div>
        </div>
        <div class="row wrap" style="margin-bottom:12px">
          <button type="button" class="btn secondary" id="exportBtn">خروجی JSON</button>
          <button type="button" class="btn secondary" id="importBtn">ورود JSON</button>
          <button type="button" class="btn ghost" id="resetBtn">پاک‌سازی کامل</button>
          <button type="button" class="btn ghost" id="selfTestBtn">تست دکمه‌ها</button>
        </div>
        <input id="importFile" type="file" accept="application/json" style="display:none">
        <div id="debugBox" class="debug"></div>
      </div>
    `;
    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'hambodje-backup-v5.json';
      a.click();
      URL.revokeObjectURL(a.href);
      log('خروجی JSON گرفته شد');
    });
    document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
    document.getElementById('importFile').addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result || '{}'));
          if (!data || !Array.isArray(data.accounts) || !Array.isArray(data.transactions)) throw new Error('bad');
          localStorage.setItem(APP_KEY, JSON.stringify(data));
          location.reload();
        } catch (e) {
          alert('فایل معتبر نیست.');
        }
      };
      reader.readAsText(file);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('همه داده‌ها پاک شود؟')) return;
      localStorage.removeItem(APP_KEY);
      location.reload();
    });
    document.getElementById('selfTestBtn').addEventListener('click', () => {
      log('تست دکمه‌ها اجرا شد');
      alert('جاوااسکریپت فعال است و دکمه‌ها کار می‌کنند.');
    });
    const box = document.getElementById('debugBox');
    if (box) box.textContent = logBuffer.join('\n');
  }
  function renderTab(name) {
    if (name === 'dashboard') renderDashboard();
    if (name === 'transactions') renderTransactions();
    if (name === 'budgets') renderBudgets();
    if (name === 'funds') renderFunds();
    if (name === 'reports') renderReports();
  }
  function render() {
    makeTabs();
    renderTab(state.activeTab);
  }

  document.getElementById('themeBtn').addEventListener('click', () => {
    const dark = document.body.classList.contains('dark');
    applyTheme(dark ? 'light' : 'dark');
  });
  document.getElementById('demoBtn').addEventListener('click', () => seedDemoData());
  document.getElementById('addBtn').addEventListener('click', () => {
    switchTab('transactions');
    window.scrollTo({top:0, behavior:'smooth'});
  });

  applyTheme(localStorage.getItem(THEME_KEY) || 'light');
  render();
  log('JS بارگذاری شد - ' + VERSION);
})();
</script>
</body>
</html>
